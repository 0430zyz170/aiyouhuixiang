<script>
/* =========================================================
   一、音效引擎
   ========================================================= */
let audioCtx = null;

function getCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(o){
  const ctx = getCtx();
  if(!ctx) return;
  const {
    freq = 440, dur = .3, type = 'sine',
    gain = .06, when = 0, slideTo = null
  } = o || {};
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + .025);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + .06);
}

function noise(o){
  const ctx = getCtx();
  if(!ctx) return;
  const { dur = 1, gain = .05, when = 0, filterFreq = 1000, q = 1 } = o || {};
  const t0 = ctx.currentTime + when;
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterFreq;
  filter.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + dur * .3);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter).connect(g).connect(ctx.destination);
  src.start(t0);
  src.stop(t0 + dur + .06);
}

const SFX = {
  click(){ beep({freq:680, dur:.07, type:'triangle', gain:.035}); },
  piano(){
    beep({freq:523.25, dur:1.3, type:'sine', gain:.05});
    beep({freq:659.25, dur:1.3, type:'sine', gain:.038, when:.09});
    beep({freq:783.99, dur:1.5, type:'sine', gain:.028, when:.18});
  },
  laugh(){
    [880,990,880,1120,990,1050].forEach((f,i)=>
      beep({freq:f, dur:.11, type:'sine', gain:.032, when:i*.125}));
  },
  train(){
    noise({dur:1.7, gain:.045, filterFreq:420, q:.8});
    beep({freq:230, dur:1.5, type:'sawtooth', gain:.026, slideTo:178});
    noise({dur:.5, gain:.03, filterFreq:1800, q:1.2, when:1.1});
  },
  message(){
    beep({freq:880, dur:.11, type:'sine', gain:.05});
    beep({freq:1174, dur:.19, type:'sine', gain:.05, when:.13});
  },
  crowd(){
    noise({dur:2.6, gain:.05, filterFreq:1150, q:.6});
    noise({dur:2.1, gain:.03, filterFreq:2400, q:.9, when:.25});
    beep({freq:523, dur:.6, type:'sine', gain:.018, when:.4});
  },
  heart(){
    beep({freq:72, dur:.28, type:'sine', gain:.11});
    beep({freq:62, dur:.3, type:'sine', gain:.085, when:.33});
  },
  star(){

/* =========================================================
   二、背景音乐
   ========================================================= */
let bgmAudio = null;
let bgmTimer = null;
let bgmStep = 0;

const BGM_NOTES = [261.63, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63];

function bgmTick(){
  if(!state.bgmOn) return;
  const f = BGM_NOTES[bgmStep % BGM_NOTES.length];
  beep({freq:f, dur:2.3, type:'sine', gain:.019});
  if(bgmStep % 4 === 0){
    beep({freq:f / 2, dur:3.4, type:'sine', gain:.012});
  }
  if(bgmStep % 8 === 6){
    beep({freq:f * 1.5, dur:1.8, type:'sine', gain:.009});
  }
  bgmStep++;
}

function startBGM(){
  if(!state.bgmOn) return;
  if(bgmAudio){
    bgmAudio.volume = .35;
    bgmAudio.play().catch(()=>{});
    return;
  }
  if(bgmTimer) return;
  bgmStep = 0;
  bgmTick();
  bgmTimer = setInterval(bgmTick, 950);
}

function stopBGM(){
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
  if(bgmAudio) bgmAudio.pause();
}

function loadBGMFile(file){
  stopBGM();
  bgmAudio = new Audio(URL.createObjectURL(file));
  bgmAudio.loop = true;
  bgmAudio.volume = .35;
  bgmAudio.play().catch(()=>{});
}

const SETTINGS_KEY = 'amyy_settings_v1';
const SAVE_KEY = 'amyy_saves_v1';

function persistSettings(){
  try{
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      bgmOn: state.bgmOn,
      sfxOn: state.sfxOn
    }));
  }catch(e){}
}

function restoreSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if(s){
      if(typeof s.bgmOn === 'boolean') state.bgmOn = s.bgmOn;
      if(typeof s.sfxOn === 'boolean') state.sfxOn = s.sfxOn;
    }
  }catch(e){}
}

/* =========================================================
   六、工具函数
   ========================================================= */
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function $(id){ return document.getElementById(id); }

function getCustomReply(node, text){
  if(node && node.custom){
    for(const c of node.custom){
      if(c.kw.some(k => text.includes(k))) return c.r;
    }
  }
  for(const c of GLOBAL_KW){
    if(c.kw.some(k => text.includes(k))) return c.r;
  }
  return '（他安静了一下，认真地看着你）……妈妈，我听到了。';
}

  const ctx = c.getContext('2d');
  let stars = [];
  let dpr = 1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr;
    c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    const count = Math.min(160, Math.floor(innerWidth * innerHeight / 9000));
    stars = Array.from({length: count}, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: (Math.random() * 1.3 + .35) * dpr,
      a: Math.random() * Math.PI * 2,
      s: Math.random() * .018 + .004
    }));
  }

  resize();
  window.addEventListener('resize', resize);

  function loop(){
    ctx.clearRect(0, 0, c.width, c.height);
    for(const st of stars){
      st.a += st.s;
      const alpha = .18 + Math.abs(Math.sin(st.a)) * .68;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(160,255,200,' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* =========================================================
   八、对话渲染
   ========================================================= */
let renderToken = 0;

function currentNode(){ return NODES[state.nodeIndex] || NODES[0]; }

function addBubble(line){
  return new Promise(resolve => {
    const dialog = $('dialog');
    const el = document.createElement('div');
    el.className = 'bubble bubble-' + line.t;
    el.textContent = line.s;
    dialog.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    dialog.scrollTop = dialog.scrollHeight;
    setTimeout(() => {
      dialog.scrollTop = dialog.scrollHeight;
      resolve();
    }, 460);
  });
}

function updateScene(node){
  $('chapterLabel').textContent = node.label;
  const ph = $('photoPlaceholder');
  const img = $('photoImg');
  const stored = state.images[node.id];
  if(stored){
    img.src = stored;
    img.classList.remove('hidden');
    ph.classList.add('hidden');
  }else{
    img.classList.add('hidden');
    ph.classList.remove('hidden');
    ph.textContent = node.emoji;
  }
}

function updateProgress(){
  const p = ((state.nodeIndex + 1) / NODES.length) * 100;
  $('progressFill').style.width = p + '%';
}

function hideOptions(){
  $('options').innerHTML = '';
}

async function playNode(index){
  const token = ++renderToken;
  state.nodeIndex = index;

  const node = NODES[index];
  if(!node) return;

  updateProgress();
  updateScene(node);
  $('dialog').innerHTML = '';
  hideOptions();

  autoSave();

  for(const line of node.lines){
    if(token !== renderToken) return;
    await addBubble(line);
    if(token !== renderToken) return;
    await sleep(280);
  }

  if(token !== renderToken) return;
  showOptions(node);
}

function showOptions(node){
  const box = $('options');
  box.innerHTML = '';

  node.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.s;
    btn.onclick = () => chooseOption(node, i);
    box.appendChild(btn);
  });

  const row = document.createElement('div');
  row.className = 'custom-row';
  row.innerHTML =
    '<input type="text" id="customInput" placeholder="说点什么给小宝……" maxlength="60">' +
    '<button id="customSend">发送</button>';
  box.appendChild(row);

  const send = () => {
    const inp = $('customInput');
    if(!inp) return;
    const v = inp.value.trim();
    if(!v) return;
    inp.value = '';
    chooseCustom(node, v);
  };

  $('customSend').onclick = send;
  $('customInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') send();
  });
}

async function chooseOption(node, i){
  const opt = node.options[i];
  state.choices[node.id] = i;
  hideOptions();
  playSfx('click');

  await addBubble({t:'mother', s:opt.s});
  await sleep(380);

  playSfx(opt.sfx);
  await addBubble({t:'ziyu', s:opt.r});
  await sleep(300);

  showContinue(node);
}

async function chooseCustom(node, text){
  hideOptions();
  playSfx('click');

  await addBubble({t:'mother', s:text});
  await sleep(480);

  playSfx('message');
  const reply = getCustomReply(node, text);
  await addBubble({t:'ziyu', s:reply});
  await sleep(300);

  showContinue(node);
}

function showContinue(node){
  const box = $('options');
  box.innerHTML = '';

  const idx = NODES.indexOf(node);
  const isLast = idx >= NODES.length - 1;

  const btn = document.createElement('button');
  btn.className = 'continue-btn';
  btn.textContent = isLast ? '走 向 2 0 2 6' : '继 续';
  btn.onclick = () => {
    playSfx('click');
    if(isLast){
      showEnding();
    }else{
      playNode(idx + 1);
    }
  };
  box.appendChild(btn);
}

/* =========================================================
   九、结局 & 自由模式
   ========================================================= */
function showEnding(){
  stopBGM();
  playSfx('star');
  setTimeout(() => playSfx('bell'), 600);
  $('progressFill').style.width = '100%';
  $('ending').classList.add('show');
}

function startFreeMode(){
  $('ending').classList.remove('show');
  $('game').classList.add('show');
  $('chapterLabel').textContent = '自由模式 · 想说什么都可以';
  $('progressFill').style.width = '100%';
  $('dialog').innerHTML = '';
  $('photoPlaceholder').textContent = '💚';
  $('photoImg').classList.add('hidden');
  $('photoPlaceholder').classList.remove('hidden');

  addBubble({t:'narration', s:'（现在，你可以随意对张泽禹说点什么了。）'});
  setTimeout(() => addBubble({t:'ziyu', s:'妈，我在呢。'}), 600);
  setTimeout(showFreeInput, 1100);
  startBGM();
}

function showFreeInput(){
  const box = $('options');
  box.innerHTML =
    '<div class="custom-row">' +
      '<input type="text" id="freeInput" placeholder="想对张泽禹说点什么……" maxlength="60">' +
      '<button id="freeSend">发送</button>' +
    '</div>';

  const send = () => {
    const inp = $('freeInput');
    if(!inp) return;
    const v = inp.value.trim();
    if(!v) return;
    inp.value = '';
    handleFree(v);
    setTimeout(() => { const el = $('freeInput'); if(el) el.focus(); }, 50);
  };

  $('freeSend').onclick = send;
  $('freeInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') send();
  });
}

async function handleFree(text){
  await addBubble({t:'mother', s:text});
  await sleep(420);
  playSfx('message');
  const reply = getCustomReply(null, text);
  await addBubble({t:'ziyu', s:reply});
}

/* =========================================================
   十、存档 / 读档
   ========================================================= */
function readSaves(){
  try{
    return JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
  }catch(e){ return {}; }
}

function writeSaves(obj){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(obj));
  }catch(e){
    console.warn('存档失败', e);
  }
}

function doSave(slot){
  const saves = readSaves();
  saves[slot] = {
    nodeIndex: state.nodeIndex,
    choices: state.choices,
    avatar: state.avatar,
    ts: Date.now(),
    label: (NODES[state.nodeIndex] || NODES[0]).label
  };
  writeSaves(saves);
}

function autoSave(){
  const saves = readSaves();
  saves.auto = {
    nodeIndex: state.nodeIndex,
    choices: state.choices,
    avatar: state.avatar,
    ts: Date.now(),
    label: (NODES[state.nodeIndex] || NODES[0]).label
  };
  writeSaves(saves);
}

function doLoad(slot){
  const saves = readSaves();
  const s = saves[slot];
  if(!s) return;

  state.nodeIndex = Math.min(s.nodeIndex || 0, NODES.length - 1);
  state.choices = s.choices || {};
  if(s.avatar) state.avatar = s.avatar;

  closeModal();
  playSfx('star');
  playNode(state.nodeIndex);
}

function formatTime(ts){
  try{
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }catch(e){ return ''; }
}

function openSaveMenu(){
  openModal('存 档', '', body => {
    const render = () => {
      const saves = readSaves();
      let html = '';
      ['slot1','slot2','slot3'].forEach((sl, i) => {
        const s = saves[sl];
        html +=
          '<div class="slot" data-slot="' + sl + '">' +
            '<div class="slot-title">存档位 ' + (i + 1) +
              (s ? ' · ' + s.label : ' · 空') + '</div>' +
            '<div class="slot-meta">' +
              (s ? formatTime(s.ts) : '点击保存当前进度') + '</div>' +
          '</div>';
      });
      if(saves.auto){
        html +=
          '<div class="slot" style="opacity:.75;cursor:default;">' +
            '<div class="slot-title">自动存档 · ' + saves.auto.label + '</div>' +
            '<div class="slot-meta">' + formatTime(saves.auto.ts) + '</div>' +
          '</div>';
      }
      body.innerHTML = html;

      body.querySelectorAll('.slot[data-slot]').forEach(el => {
        el.onclick = () => {
          doSave(el.dataset.slot);
          playSfx('message');
          render();
        };
      });
    };
    render();
  });
}

function openLoadMenu(){
  openModal('读 档', '', body => {
    const saves = readSaves();
    let html = '';
    let hasAny = false;

    ['slot1','slot2','slot3'].forEach((sl, i) => {
      const s = saves[sl];
      if(s) hasAny = true;
      html +=
        '<div class="slot' + (s ? '' : ' empty') + '" data-slot="' + (s ? sl : '') + '">' +
          '<div class="slot-title">存档位 ' + (i + 1) +
            (s ? ' · ' + s.label : ' · 空') + '</div>' +
          '<div class="slot-meta">' +
            (s ? formatTime(s.ts) : '暂无记录') + '</div>' +
        '</div>';
    });

    if(saves.auto){
      hasAny = true;
      html +=
        '<div class="slot" data-slot="auto">' +
          '<div class="slot-title">自动存档 · ' + saves.auto.label + '</div>' +
          '<div class="slot-meta">' + formatTime(saves.auto.ts) + '</div>' +
        '</div>';
    }

    if(!hasAny){
      html += '<p class="tip">还没有任何存档。先去经历一段故事吧。</p>';
    }

    body.innerHTML = html;

    body.querySelectorAll('.slot[data-slot]').forEach(el => {
      const slot = el.dataset.slot;
      if(!slot) return;
      el.onclick = () => doLoad(slot);
    });
  });
}

/* =========================================================
   十一、设置
   ========================================================= */
function openSettings(){
  const html =
    '<div class="setting-row">' +
      '<span>背景音乐</span>' +
      '<button class="toggle ' + (state.bgmOn ? 'on' : '') + '" id="tgBgm">' +
        (state.bgmOn ? '开' : '关') + '</button>' +
    '</div>' +
    '<div class="setting-row">' +
      '<span>音效</span>' +
      '<button class="toggle ' + (state.sfxOn ? 'on' : '') + '" id="tgSfx">' +
        (state.sfxOn ? '开' : '关') + '</button>' +
    '</div>' +
    '<div class="setting-row">' +
      '<span>孔女士头像</span>' +
      '<button class="mini-btn" id="upAvatar">上传</button>' +
    '</div>' +
    '<div class="setting-row">' +
      '<span>自定义背景音乐</span>' +
      '<button class="mini-btn" id="upBgm">选择音频</button>' +
    '</div>' +
    '<p class="tip">提示：可上传《失眠了》吴琳柯版本音频文件作为背景音乐，' +
    '未上传时使用内置的柔和旋律。头像与照片仅保存在本机浏览器中。</p>';

  openModal('设 置', html, body => {
    const tgBgm = body.querySelector('#tgBgm');
    const tgSfx = body.querySelector('#tgSfx');

    tgBgm.onclick = () => {
      state.bgmOn = !state.bgmOn;
      tgBgm.classList.toggle('on', state.bgmOn);
      tgBgm.textContent = state.bgmOn ? '开' : '关';
      persistSettings();
      if(state.bgmOn) startBGM(); else stopBGM();
    };

    tgSfx.onclick = () => {
      state.sfxOn = !state.sfxOn;
      tgSfx.classList.toggle('on', state.sfxOn);
      tgSfx.textContent = state.sfxOn ? '开' : '关';
      persistSettings();
      if(state.sfxOn) playSfx('click');
    };

    body.querySelector('#upAvatar').onclick = () => {
      pickFile('image/*', dataUrl => {
        state.avatar = dataUrl;
        playSfx('shutter');
      });
    };

    body.querySelector('#upBgm').onclick = () => {
      pickFile('audio/*', null, file => {
        loadBGMFile(file);
        state.bgmOn = true;
        persistSettings();
      });
    };
  });
}

function pickFile(accept, onDataUrl, onFile){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  input.onchange = () => {
    const f = input.files && input.files[0];
    if(!f) return;
    if(onFile){ onFile(f); return; }
    const reader = new FileReader();
    reader.onload = e => onDataUrl(e.target.result);
    reader.readAsDataURL(f);
  };
  input.click();
}

  $('modalTitle').textContent = title;

function closeModal(){

}
